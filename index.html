<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>セットプレス CAM</title>
<meta name="theme-color" content="#2b3a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SP CAM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  /* style.css が読めなかったときでも、描く領域が潰れないようにする最低限の配置 */
  * { touch-action: pan-x pan-y; }
  #canvas { touch-action: none; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; }
  #work { display: flex; flex: 1; min-height: 0; }
  #stage { position: relative; flex: 1; min-width: 0; min-height: 0; }
</style>
<link rel="stylesheet" href="style.css?v=0.10.2">
<!-- ?v= は tools/bump_version.py で書き換える。古い style.css・app.js と組み合わさらないようにするため -->
</head>
<body>
<header id="toolbar">
  <div class="group">
    <button id="btn-draw" class="mode active" data-mode="draw">作図</button>
    <button id="btn-dim" class="mode" data-mode="dim">寸法</button>
    <button id="btn-move" class="mode" data-mode="move">移動</button>
  </div>
  <div class="group">
    <button id="btn-undo">元に戻す</button>
    <button id="btn-delete" disabled>削除</button>
    <button id="btn-fit">全体表示</button>
  </div>
  <div class="group">
    <label>板 <input id="sheet-w" type="number" inputmode="decimal" min="10" max="5000"> ×
      <input id="sheet-h" type="number" inputmode="decimal" min="10" max="5000"> mm</label>
    <label>グリッド
      <select id="snap">
        <option value="0.1">0.1</option>
        <option value="1">1</option>
        <option value="5" selected>5</option>
        <option value="10">10</option>
      </select> mm</label>
  </div>
  <div class="group right">
    <button id="btn-tools">金型</button>
    <button id="btn-new">新規</button>
    <button id="btn-open">開く</button>
    <button id="btn-save" class="primary">保存</button>
  </div>
</header>

<div id="work">
<main id="stage">
  <canvas id="canvas"></canvas>
  <div id="props" hidden></div>
</main>

<aside id="code-panel">
  <div class="code-head">
    <span class="code-title">コード</span>
    <span class="code-note">図形データ</span>
    <button id="btn-copy" type="button">コピー</button>
  </div>
  <div id="code" role="textbox" aria-readonly="true" aria-multiline="true" aria-label="コード"></div>
</aside>
</div>

<footer id="status">
  <span id="st-name">名前なし</span>
  <span id="st-prog"></span>
  <span id="st-tools"></span>
  <span id="st-count"></span>
  <span id="st-pos"></span>
  <span id="st-msg"></span>
  <span id="st-ver"></span>
</footer>

<dialog id="dlg-save">
  <form method="dialog">
    <h2>保存</h2>
    <label>名前 <input id="save-name" type="text" required maxlength="60"></label>
    <div class="dlg-buttons">
      <button type="button" id="save-cancel">キャンセル</button>
      <button value="ok" class="primary">保存</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-project">
  <form id="project-form" novalidate>
    <h2 id="project-title">新規作成</h2>
    <label class="prog">プログラム番号 O
      <input id="program-no" type="number" inputmode="numeric" min="1" max="9999" step="1" placeholder="1〜9999">
    </label>
    <div class="tools-head">使用する金型</div>
    <div id="tool-rows"></div>
    <p id="project-err" class="err" role="alert"></p>
    <div class="dlg-buttons">
      <button type="button" id="project-cancel">キャンセル</button>
      <button type="submit" class="primary" id="project-ok">作成</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-open">
  <form method="dialog">
    <h2>開く</h2>
    <ul id="open-list"></ul>
    <div class="dlg-buttons">
      <button type="button" id="btn-import">ファイルから読み込む</button>
      <button type="button" id="btn-export">ファイルに書き出す</button>
      <button value="cancel">閉じる</button>
    </div>
    <input id="import-file" type="file" accept=".json,application/json" hidden>
  </form>
</dialog>

<dialog id="dlg-confirm">
  <form method="dialog">
    <p id="confirm-text"></p>
    <div class="dlg-buttons">
      <button value="cancel">キャンセル</button>
      <button value="ok" class="primary" id="confirm-ok">OK</button>
    </div>
  </form>
</dialog>

<script src="geom.js?v=0.10.2"></script>
<script src="app.js?v=0.10.2"></script>
</body>
</html>
